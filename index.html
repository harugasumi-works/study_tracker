<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Progress Line</title>
<link rel="icon" href="data:," />
<style>
  @import url('https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap');
  * { box-sizing: border-box; }
  body { margin: 0; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>
</head>
<body>
<div id="root"></div>

<!--
  This app has no build step — Babel standalone (loaded above) transforms
  JSX in the browser at page load. Because these are plain classic scripts
  (not <script type="module">), they all share one global scope: a
  function or const declared in one file is visible to every file loaded
  after it, in order, same as if it were one big file. That means:

    1. Load order below IS the dependency order. If you move a script,
       make sure whatever it depends on still loads before it.
    2. Never re-declare the same top-level name in two files — that's a
       SyntaxError, not a silent shadow.

  js/react-globals.js   → useState/useEffect/useCallback shortcuts (first, always)
  js/constants.js       → default tracks, colors, storage keys, config
  js/utils.js           → dates, streaks, stats, the storage drop-in
  js/icons.js           → small SVG icon components
  js/plugin-system.js   → generic plugin registry + /plugin loader
  js/components/*.js    → Analysis, Manage, StudyTracker
  js/app.js             → mounts <StudyTracker /> (last, always)
-->
<script type="text/babel" data-presets="react" src="js/react-globals.js"></script>
<script type="text/babel" data-presets="react" src="js/constants.js"></script>
<script type="text/babel" data-presets="react" src="js/utils.js"></script>
<script type="text/babel" data-presets="react" src="js/icons.js"></script>
<script type="text/babel" data-presets="react" src="js/plugin-system.js"></script>
<script type="text/babel" data-presets="react" src="js/components/analysis.js"></script>
<script type="text/babel" data-presets="react" src="js/components/manage.js"></script>
<script type="text/babel" data-presets="react" src="js/components/study-tracker.js"></script>
<script type="text/babel" data-presets="react" src="js/app.js"></script>
</body>
</html>
