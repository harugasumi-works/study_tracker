<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Progress Line</title>
<link rel="icon" href="data:," />
<style>
  @import url('https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap');
  * { box-sizing: border-box; }
  body { margin: 0; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const { useState, useEffect, useCallback } = React;

function ChevronLeft(props) {
  return (
    <svg width={props.size || 18} height={props.size || 18} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
      <polyline points="15 18 9 12 15 6" />
    </svg>
  );
}
function ChevronRight(props) {
  return (
    <svg width={props.size || 18} height={props.size || 18} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
      <polyline points="9 18 15 12 9 6" />
    </svg>
  );
}

const TRACKS = [
  { id: 'it_passport', name: 'IT Passport', category: 'Core study', color: '#3B4C9E' },
  { id: 'coding', name: 'Coding', category: 'Core study', color: '#2F7D5C' },
  { id: 'jp_book', name: 'Japanese book reading', category: 'Sub study', color: '#9C3D54' },
  { id: 'kanken', name: 'Kanken', category: 'Sub study', color: '#C08A2E' },
  { id: 'schoo', name: 'Schoo.jp', category: 'Sub study', color: '#3E7C86' },
  { id: 'coding_blog', name: 'Coding blog (Markdown)', category: 'Output', color: '#C1613B' },
  { id: 'jp_blog', name: 'Japanese essay blog (朝刊太郎)', category: 'Output', color: '#6B4A8A' },
];

const CATEGORIES = ['Core study', 'Sub study', 'Output'];
const DAYS_SHOWN = 14;
const STORAGE_KEY = 'tracker-history';
const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

function isoDate(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}
function parseLocal(dateStr) {
  return new Date(dateStr + 'T00:00:00');
}
function getLastNDates(n, endDateStr) {
  const end = parseLocal(endDateStr);
  const dates = [];
  for (let i = n - 1; i >= 0; i--) {
    const d = new Date(end);
    d.setDate(d.getDate() - i);
    dates.push(isoDate(d));
  }
  return dates;
}
function dayLabel(dateStr, isFirst) {
  const d = parseLocal(dateStr);
  const day = d.getDate();
  if (isFirst || day === 1) return `${MONTHS[d.getMonth()]} ${day}`;
  return String(day);
}
function formatFullDate(dateStr) {
  const d = parseLocal(dateStr);
  return d.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
}
function computeStreak(history, trackId, todayStr) {
  let streak = 0;
  let cursor = parseLocal(todayStr);
  while (true) {
    const key = isoDate(cursor);
    if (history[key] && history[key][trackId] && history[key][trackId].done) {
      streak++;
      cursor.setDate(cursor.getDate() - 1);
    } else break;
  }
  return streak;
}

// Drop-in replacement for the Claude artifact storage API, backed by localStorage.
const storage = {
  get: async (key) => {
    const raw = window.localStorage.getItem(key);
    return raw === null ? null : { key, value: raw };
  },
  set: async (key, value) => {
    window.localStorage.setItem(key, value);
    return { key, value };
  },
};

const RANGE_OPTIONS = [
  { id: 14, label: '2 weeks' },
  { id: 30, label: '30 days' },
  { id: 90, label: '90 days' },
];
const HEATMAP_WEEKS = 12;

function rangeStats(history, dates) {
  const perTrack = {};
  TRACKS.forEach((t) => { perTrack[t.id] = 0; });
  let total = 0;
  dates.forEach((d) => {
    TRACKS.forEach((t) => {
      if (history[d]?.[t.id]?.done) {
        perTrack[t.id] += 1;
        total += 1;
      }
    });
  });
  return { perTrack, total, possible: dates.length * TRACKS.length };
}

function categoryStats(history, dates) {
  const stats = {};
  CATEGORIES.forEach((cat) => {
    const catTracks = TRACKS.filter((t) => t.category === cat);
    let done = 0;
    dates.forEach((d) => {
      catTracks.forEach((t) => {
        if (history[d]?.[t.id]?.done) done += 1;
      });
    });
    stats[cat] = { done, possible: dates.length * catTracks.length };
  });
  return stats;
}

function heatmapWeeks(history, todayStr, weeks) {
  const end = parseLocal(todayStr);
  const endDay = end.getDay();
  const gridEnd = new Date(end);
  gridEnd.setDate(gridEnd.getDate() + (6 - endDay));
  const totalDays = weeks * 7;
  const cells = [];
  for (let i = totalDays - 1; i >= 0; i--) {
    const d = new Date(gridEnd);
    d.setDate(d.getDate() - i);
    const dateStr = isoDate(d);
    const inRange = dateStr <= todayStr;
    const count = inRange ? TRACKS.filter((t) => history[dateStr]?.[t.id]?.done).length : null;
    cells.push({ dateStr, count });
  }
  const columns = [];
  for (let i = 0; i < cells.length; i += 7) columns.push(cells.slice(i, i + 7));
  return columns;
}

function heatColor(count) {
  if (count === null) return 'transparent';
  if (count === 0) return '#E9EBEF';
  const alpha = 0.28 + (count / TRACKS.length) * 0.72;
  return `rgba(27, 31, 42, ${alpha.toFixed(2)})`;
}

function Analysis({ history, todayStr }) {
  const [rangeDays, setRangeDays] = useState(30);
  const dates = getLastNDates(rangeDays, todayStr);
  const { perTrack, total, possible } = rangeStats(history, dates);
  const catStats = categoryStats(history, dates);
  const weeks = heatmapWeeks(history, todayStr, HEATMAP_WEEKS);
  const maxTrackCount = Math.max(1, ...TRACKS.map((t) => perTrack[t.id]));

  return (
    <div>
      <div style={{ display: 'flex', alignItems: 'baseline', justifyContent: 'space-between', marginBottom: 24, flexWrap: 'wrap', gap: 12 }}>
        <div>
          <div style={{ fontFamily: 'Newsreader, serif', fontSize: 28, fontStyle: 'italic' }}>
            {total} <span style={{ fontSize: 16, fontStyle: 'normal', opacity: 0.5 }}>of {possible} sessions</span>
          </div>
          <div style={{ fontSize: 12, opacity: 0.45, marginTop: 2 }}>
            completed in the last {rangeDays} days
          </div>
        </div>
        <div style={{ display: 'flex', gap: 4 }}>
          {RANGE_OPTIONS.map((opt) => (
            <button
              key={opt.id}
              onClick={() => setRangeDays(opt.id)}
              style={{
                fontFamily: 'IBM Plex Mono, monospace',
                fontSize: 11,
                padding: '5px 10px',
                borderRadius: 4,
                border: `1px solid ${rangeDays === opt.id ? '#1B1F2A' : '#E1E4EA'}`,
                background: rangeDays === opt.id ? '#1B1F2A' : 'transparent',
                color: rangeDays === opt.id ? '#F5F6F8' : 'inherit',
                opacity: rangeDays === opt.id ? 1 : 0.6,
                cursor: 'pointer',
              }}
            >
              {opt.label}
            </button>
          ))}
        </div>
      </div>

      <div style={{ marginBottom: 36 }}>
        <h2 style={{ fontSize: 14, opacity: 0.6, marginBottom: 16, fontWeight: 400 }}>By track</h2>
        {TRACKS.map((t) => {
          const count = perTrack[t.id];
          const pct = dates.length ? Math.round((count / dates.length) * 100) : 0;
          const barPct = Math.round((count / maxTrackCount) * 100);
          return (
            <div key={t.id} style={{ display: 'flex', alignItems: 'center', gap: 12, marginBottom: 10 }}>
              <div style={{ width: 150, flexShrink: 0, fontSize: 13, fontFamily: 'Newsreader, serif' }}>
                {t.name}
              </div>
              <div style={{ flex: 1, height: 8, borderRadius: 4, background: '#EDEFF2', overflow: 'hidden' }}>
                <div style={{ width: `${barPct}%`, height: '100%', background: t.color, opacity: 0.85 }} />
              </div>
              <div style={{ width: 84, flexShrink: 0, textAlign: 'right', fontSize: 11, opacity: 0.55 }}>
                {count}/{dates.length} · {pct}%
              </div>
            </div>
          );
        })}
      </div>

      <div style={{ marginBottom: 36, display: 'flex', gap: 24, flexWrap: 'wrap' }}>
        {CATEGORIES.map((cat) => {
          const s = catStats[cat];
          const pct = s.possible ? Math.round((s.done / s.possible) * 100) : 0;
          return (
            <div key={cat} style={{ flex: '1 1 140px', border: '1px solid #E1E4EA', borderRadius: 6, padding: '14px 16px', background: '#FFFFFF' }}>
              <div style={{ fontSize: 12, opacity: 0.5, marginBottom: 6 }}>{cat}</div>
              <div style={{ fontFamily: 'Newsreader, serif', fontSize: 22 }}>{pct}%</div>
              <div style={{ fontSize: 11, opacity: 0.4, marginTop: 2 }}>{s.done} of {s.possible}</div>
            </div>
          );
        })}
      </div>

      <div style={{ marginBottom: 36 }}>
        <h2 style={{ fontSize: 14, opacity: 0.6, marginBottom: 16, fontWeight: 400 }}>Activity, last {HEATMAP_WEEKS} weeks</h2>
        <div style={{ display: 'flex', gap: 3, overflowX: 'auto', paddingBottom: 4 }}>
          {weeks.map((col, i) => (
            <div key={i} style={{ display: 'flex', flexDirection: 'column', gap: 3 }}>
              {col.map((cell) => (
                <div
                  key={cell.dateStr}
                  title={cell.count === null ? '' : `${cell.dateStr}: ${cell.count}/${TRACKS.length}`}
                  style={{ width: 11, height: 11, borderRadius: 2, background: heatColor(cell.count) }}
                />
              ))}
            </div>
          ))}
        </div>
      </div>

      <div>
        <h2 style={{ fontSize: 14, opacity: 0.6, marginBottom: 16, fontWeight: 400 }}>Current streaks</h2>
        {TRACKS.slice()
          .sort((a, b) => computeStreak(history, b.id, todayStr) - computeStreak(history, a.id, todayStr))
          .map((t) => {
            const streak = computeStreak(history, t.id, todayStr);
            return (
              <div key={t.id} style={{ display: 'flex', justifyContent: 'space-between', padding: '8px 0', borderTop: '1px solid #EDEFF2', fontSize: 13 }}>
                <span>{t.name}</span>
                <span style={{ color: t.color, opacity: streak > 0 ? 0.9 : 0.3, fontFamily: 'IBM Plex Mono, monospace', fontSize: 12 }}>
                  {streak > 0 ? `${streak} days` : '—'}
                </span>
              </div>
            );
          })}
      </div>
    </div>
  );
}

function StudyTracker() {
  const todayStr = isoDate(new Date());
  const [history, setHistory] = useState({});
  const [loaded, setLoaded] = useState(false);
  const [selectedDate, setSelectedDate] = useState(todayStr);
  const [saving, setSaving] = useState(false);
  const [errorMsg, setErrorMsg] = useState('');
  const [confirmReset, setConfirmReset] = useState(false);
  const [view, setView] = useState('tracker');

  useEffect(() => {
    (async () => {
      try {
        const result = await storage.get(STORAGE_KEY);
        if (result && result.value) setHistory(JSON.parse(result.value));
      } catch (e) {
        setHistory({});
      } finally {
        setLoaded(true);
      }
    })();
  }, []);

  const persist = useCallback(async (nextHistory) => {
    setSaving(true);
    try {
      const result = await storage.set(STORAGE_KEY, JSON.stringify(nextHistory));
      if (!result) setErrorMsg('Could not save — your last change may not persist.');
      else setErrorMsg('');
    } catch (e) {
      setErrorMsg('Could not save — your last change may not persist.');
    } finally {
      setSaving(false);
    }
  }, []);

  const toggleDone = (dateStr, trackId) => {
    setHistory((prev) => {
      const day = { ...(prev[dateStr] || {}) };
      const entry = { ...(day[trackId] || { done: false, note: '' }) };
      entry.done = !entry.done;
      day[trackId] = entry;
      const next = { ...prev, [dateStr]: day };
      persist(next);
      return next;
    });
  };

  const updateNote = (dateStr, trackId, note) => {
    setHistory((prev) => {
      const day = { ...(prev[dateStr] || {}) };
      const entry = { ...(day[trackId] || { done: false, note: '' }) };
      entry.note = note;
      day[trackId] = entry;
      const next = { ...prev, [dateStr]: day };
      persist(next);
      return next;
    });
  };

  const resetAll = async () => {
    setHistory({});
    await persist({});
    setConfirmReset(false);
  };

  const shiftSelectedDate = (delta) => {
    setSelectedDate((prev) => {
      const d = parseLocal(prev);
      d.setDate(d.getDate() + delta);
      const next = isoDate(d);
      return next <= todayStr ? next : prev;
    });
  };

  const dates = getLastNDates(DAYS_SHOWN, todayStr);
  const doneCountForSelected = TRACKS.filter((t) => history[selectedDate]?.[t.id]?.done).length;

  if (!loaded) {
    return (
      <div style={{ fontFamily: 'IBM Plex Mono, monospace', background: '#F5F6F8', minHeight: '100vh', padding: 32, fontSize: 14, opacity: 0.5 }}>
        Loading your tracker…
      </div>
    );
  }

  return (
    <div style={{ background: '#F5F6F8', minHeight: '100vh', fontFamily: 'IBM Plex Mono, monospace', color: '#1B1F2A', padding: '24px 16px' }}>
      <div style={{ maxWidth: 720, margin: '0 auto' }}>
      <div style={{ marginBottom: 40 }}>
        <h1 style={{ fontFamily: 'Newsreader, serif', fontStyle: 'italic', fontWeight: 500, fontSize: 32, margin: '0 0 4px' }}>
          Progress Line
        </h1>
        <p style={{ fontSize: 13, opacity: 0.5, margin: 0 }}>
          {formatFullDate(todayStr)} · tap any day to mark it done — the line grows as you go
        </p>
      </div>

      <div style={{ display: 'flex', gap: 24, marginBottom: 32, borderBottom: '1px solid #E1E4EA' }}>
        {[
          { id: 'tracker', label: 'Tracker' },
          { id: 'analysis', label: 'Analysis' },
        ].map((tab) => (
          <button
            key={tab.id}
            onClick={() => setView(tab.id)}
            style={{
              background: 'none',
              border: 'none',
              cursor: 'pointer',
              padding: '0 0 10px',
              fontFamily: 'IBM Plex Mono, monospace',
              fontSize: 13,
              color: 'inherit',
              opacity: view === tab.id ? 0.95 : 0.4,
              borderBottom: view === tab.id ? '2px solid #1B1F2A' : '2px solid transparent',
              marginBottom: -1,
            }}
          >
            {tab.label}
          </button>
        ))}
      </div>

      {view === 'tracker' && (
      <>
      {CATEGORIES.map((cat) => (
        <div key={cat} style={{ marginBottom: 36 }}>
          <h2 style={{ fontSize: 14, opacity: 0.6, marginBottom: 16, fontWeight: 400 }}>{cat}</h2>
          {TRACKS.filter((t) => t.category === cat).map((track) => {
            const streak = computeStreak(history, track.id, todayStr);
            const gridCols = `repeat(${dates.length}, 24px) 20px`;
            return (
              <div key={track.id} style={{ display: 'flex', alignItems: 'flex-start', gap: 16, marginBottom: 24 }}>
                <div style={{ width: 150, flexShrink: 0, paddingTop: 4 }}>
                  <div style={{ fontFamily: 'Newsreader, serif', fontSize: 15, lineHeight: 1.3 }}>
                    {track.name}
                  </div>
                  <div style={{ fontSize: 10, marginTop: 2, color: track.color, opacity: 0.85 }}>
                    {streak > 0 ? `${streak}-day streak` : '—'}
                  </div>
                </div>
                <div style={{ flex: 1, minWidth: 0, overflowX: 'auto' }}>
                  <div style={{ display: 'grid', gridTemplateColumns: gridCols, alignItems: 'center', position: 'relative', height: 28 }}>
                    <div style={{ position: 'absolute', left: 12, right: 8, top: '50%', height: 3, background: track.color, opacity: 0.22, transform: 'translateY(-50%)' }} />
                    {dates.map((d) => {
                      const done = !!history[d]?.[track.id]?.done;
                      const isToday = d === todayStr;
                      return (
                        <div key={d} style={{ display: 'flex', justifyContent: 'center', position: 'relative', zIndex: 1 }}>
                          <button
                            onClick={() => toggleDone(d, track.id)}
                            aria-label={`${track.name} on ${d}${done ? ', done' : ', not done'}`}
                            style={{
                              width: isToday ? 15 : 11,
                              height: isToday ? 15 : 11,
                              borderRadius: '50%',
                              background: done ? track.color : '#FFFFFF',
                              border: `2px solid ${done ? track.color : '#C7CBD4'}`,
                              boxShadow: isToday ? `0 0 0 3px ${track.color}22` : 'none',
                              cursor: 'pointer',
                              padding: 0,
                            }}
                          />
                        </div>
                      );
                    })}
                    <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', position: 'relative', zIndex: 1 }}>
                      <div
                        style={{
                          width: 0,
                          height: 0,
                          borderTop: '5px solid transparent',
                          borderBottom: '5px solid transparent',
                          borderLeft: `9px solid ${track.color}66`,
                        }}
                      />
                    </div>
                  </div>
                  <div style={{ display: 'grid', gridTemplateColumns: gridCols }}>
                    {dates.map((d, i) => (
                      <div
                        key={d}
                        style={{
                          textAlign: 'center',
                          fontSize: 9,
                          opacity: d === todayStr ? 0.9 : 0.35,
                          fontWeight: d === todayStr ? 600 : 400,
                        }}
                      >
                        {dayLabel(d, i === 0)}
                      </div>
                    ))}
                    <div />
                  </div>
                </div>
              </div>
            );
          })}
        </div>
      ))}

      <div style={{ marginTop: 16, maxWidth: 560 }}>
        <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 16 }}>
          <button onClick={() => shiftSelectedDate(-1)} style={{ padding: 4, opacity: 0.6, background: 'none', border: 'none', cursor: 'pointer', color: 'inherit' }} aria-label="Previous day">
            <ChevronLeft size={18} />
          </button>
          <div style={{ fontFamily: 'Newsreader, serif', fontSize: 20, textAlign: 'center' }}>
            {selectedDate === todayStr ? 'Today' : formatFullDate(selectedDate)}
          </div>
          <button
            onClick={() => shiftSelectedDate(1)}
            disabled={selectedDate === todayStr}
            style={{ padding: 4, opacity: selectedDate === todayStr ? 0.2 : 0.6, background: 'none', border: 'none', cursor: selectedDate === todayStr ? 'default' : 'pointer', color: 'inherit' }}
            aria-label="Next day"
          >
            <ChevronRight size={18} />
          </button>
        </div>

        <div style={{ borderRadius: 6, overflow: 'hidden', border: '1px solid #E1E4EA', background: '#FFFFFF' }}>
          {CATEGORIES.map((cat) => (
            <div key={cat}>
              <div style={{ padding: '8px 16px', fontSize: 12, opacity: 0.5, background: '#EFF1F4' }}>
                {cat}
              </div>
              {TRACKS.filter((t) => t.category === cat).map((track) => {
                const entry = history[selectedDate]?.[track.id] || { done: false, note: '' };
                return (
                  <div key={track.id} style={{ display: 'flex', alignItems: 'center', gap: 12, padding: '12px 16px', borderTop: '1px solid #EDEFF2' }}>
                    <button
                      onClick={() => toggleDone(selectedDate, track.id)}
                      aria-label={`Mark ${track.name} ${entry.done ? 'not done' : 'done'}`}
                      style={{
                        width: 18,
                        height: 18,
                        borderRadius: 4,
                        flexShrink: 0,
                        background: entry.done ? track.color : '#fff',
                        border: `2px solid ${entry.done ? track.color : '#C7CBD4'}`,
                        cursor: 'pointer',
                        padding: 0,
                      }}
                    />
                    <div style={{ flex: 1, minWidth: 0 }}>
                      <div style={{ fontSize: 14, textDecoration: entry.done ? 'line-through' : 'none', opacity: entry.done ? 0.5 : 1 }}>
                        {track.name}
                      </div>
                      <input
                        type="text"
                        value={entry.note}
                        onChange={(e) => updateNote(selectedDate, track.id, e.target.value)}
                        placeholder="add a note…"
                        style={{ width: '100%', fontSize: 12, background: 'transparent', outline: 'none', marginTop: 2, border: 'none', color: '#6B7280', fontFamily: 'IBM Plex Mono, monospace' }}
                      />
                    </div>
                  </div>
                );
              })}
            </div>
          ))}
        </div>

        <div style={{ fontSize: 12, opacity: 0.4, marginTop: 12 }}>
          {doneCountForSelected} of {TRACKS.length} done{saving ? ' · saving…' : ''}
        </div>
        {errorMsg && (
          <div style={{ fontSize: 12, marginTop: 8, color: '#B3261E' }}>
            {errorMsg}
          </div>
        )}
      </div>

      <div style={{ marginTop: 40, fontSize: 12, opacity: 0.4 }}>
        {confirmReset ? (
          <span>
            Clear all saved progress?{' '}
            <button onClick={resetAll} style={{ textDecoration: 'underline', background: 'none', border: 'none', cursor: 'pointer', color: 'inherit', font: 'inherit', padding: 0 }}>
              Yes, reset
            </button>{' '}
            ·{' '}
            <button onClick={() => setConfirmReset(false)} style={{ textDecoration: 'underline', background: 'none', border: 'none', cursor: 'pointer', color: 'inherit', font: 'inherit', padding: 0 }}>
              Cancel
            </button>
          </span>
        ) : (
          <button onClick={() => setConfirmReset(true)} style={{ textDecoration: 'underline', opacity: 0.6, background: 'none', border: 'none', cursor: 'pointer', color: 'inherit', font: 'inherit', padding: 0 }}>
            Reset all data
          </button>
        )}
      </div>
      </>
      )}

      {view === 'analysis' && <Analysis history={history} todayStr={todayStr} />}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<StudyTracker />);
</script>
</body>
</html>
